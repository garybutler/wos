<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoS Troop Toolkit</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
</head>
<body>
  <div class="container">
    <h1>Troop Command Center</h1>

    <section>
      <h2>1. Determine Training Speed</h2>
      <div class="input-group">
        <select id="revTypeSelect"><option>Infantry</option><option>Lancer</option><option>Marksman</option></select>
        <select id="revLevelSelect"></select>
        <input type="number" id="revAmount" placeholder="Amount">
      </div>
      <div class="input-group">
        <input type="number" id="days" placeholder="D">
        <input type="number" id="hours" placeholder="H">
        <input type="number" id="mins" placeholder="M">
        <input type="number" id="secs" placeholder="S">
      </div>
      <div class="input-group">
        <input type="number" id="stateBuff" placeholder="State Buff %">
        <input type="number" id="ministerBuff" placeholder="Minister %">
      </div>
      <button id="btnCalculateRaw">Calculate Speed</button>
      <p>Raw Speed: <span id="rawSpeedResult">0</span>% | Total: <span id="totalSpeedResult">0</span>%</p>
    </section>

    <section>
      <h2>2. New Training</h2>
      <div class="input-group">
        <select id="typeSelect"><option>Infantry</option><option>Lancer</option><option>Marksman</option></select>
        <select id="levelSelect"></select>
        <input type="number" id="trainAmount" placeholder="Amount">
      </div>
      <button id="btnCalcTrain">Calculate Training</button>
      <div class="results">
        <p>Time: <span id="timeResult">0s</span> | KOI: <span id="koiResult">0</span></p>
        <p>🥩 <span id="meatRes">0</span> | 🪵 <span id="woodRes">0</span> | 🪵 <span id="coalRes">0</span> | ⚙️ <span id="ironRes">0</span></p>
      </div>
    </section>

    <section>
      <h2>3. Promotion</h2>
      <div class="input-group">
        <select id="promoTypeSelect"><option>Infantry</option><option>Lancer</option><option>Marksman</option></select>
        <select id="promoFrom"></select> ⮕ <select id="promoTo"></select>
        <input type="number" id="promoAmount" placeholder="Amount">
      </div>
      <button id="btnCalcPromo">Calculate Promotion</button>
      <div class="results">
        <p>Time: <span id="promoTimeResult">0s</span> | KOI: <span id="promoPointsResult">0</span></p>
        <p>🥩 <span id="promoMeatRes">0</span> | 🪵 <span id="promoWoodRes">0</span> | 🪵 <span id="promoCoalRes">0</span> | ⚙️ <span id="promoIronRes">0</span></p>
      </div>
    </section>

    <button id="btnClear" style="background: #666; margin-top: 20px;">Clear All Fields</button>
    <br><br>
    <a href="../index.html">Back to Hub</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
